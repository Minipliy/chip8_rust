<!DOCTYPE html>
<html>

<head>
    <title>Chip-8 Emulator</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }

        h1 {
            text-align: center;
        }

        .controls {
            margin: 20px 0;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        select,
        input[type="file"] {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
        }

        canvas {
            display: block;
            margin: 20px auto;
            background: #000;
            border: 2px solid #444;
        }

        /* Mobile Keyboard Styles */
        #mobile-keyboard {
            display: none;
            max-width: 400px;
            margin: 20px auto;
            padding: 15px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
        }

        .keyboard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .key-btn {
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            background: #3a3a3a;
            color: #fff;
            border: 2px solid #555;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            transition: all 0.1s;
        }

        .key-btn:active,
        .key-btn.pressed {
            background: #4a9eff;
            border-color: #2a7edf;
            transform: scale(0.95);
        }

        .key-btn:hover {
            background: #4a4a4a;
        }

        /* Show keyboard on mobile */
        @media (max-width: 768px) {
            #mobile-keyboard {
                display: block;
            }

            canvas {
                max-width: 100%;
                height: auto;
            }
        }
    </style>
</head>

<body>
    <h1>🎮 Chip-8 Emulator</h1>

    <div class="controls">
        <div>
            <label for="gameselect">Choose a game: </label>
            <select id="gameselect">
                <option value="">-- Select a game --</option>
                <option value="c8games/15PUZZLE">15 Puzzle</option>
                <option value="c8games/BRIX">Brix</option>
                <option value="c8games/INVADERS">Space Invaders</option>
                <option value="c8games/MERLIN">Merlin</option>
                <option value="c8games/MISSILE">Missile</option>
                <option value="c8games/PONG2">Pong</option>
                <option value="c8games/TETRIS">Tetris</option>
                <option value="c8games/TICTAC">Tic Tac Toe</option>
                <option value="c8games/UFO">UFO</option>
                <option value="c8games/VBRIX">VBrix</option>
                <option value="c8games/VERS">Vers</option>
                <option value="c8games/RPS.ch8">RPS</option>
            </select>
        </div>

        <div id="gamedescription" style="
            background:#222;
            border:1px solid #444;
            padding:15px;
            border-radius:6px;
            margin-top:10px;
            white-space:pre-line;
        ">
            Select a game to see instructions.
        </div>

        <div>
            <label for="fileinput">Upload CHIP-8 ROM: </label>
            <input type="file" id="fileinput" accept=".ch8,.c8" autocomplete="off" />
            <small style="display: block; color: #888; margin-top: 5px;">
                Supported formats: .ch8, .c8 (CHIP-8 binary ROM files)
            </small>
        </div>
    </div>

    <canvas id="canvas">If you see this message, then your browser doesn't support HTML5</canvas>

    <!-- Mobile Touch Keyboard -->
    <!-- Mobile Touch Keyboard -->
    <div id="mobile-keyboard">
        <h3 style="text-align: center; margin-top: 0;">Touch Controls</h3>
        <div class="keyboard-grid">
            <button class="key-btn" data-key="1">1</button>
            <button class="key-btn" data-key="2">2</button>
            <button class="key-btn" data-key="3">3</button>
            <button class="key-btn" data-key="4">4</button>

            <button class="key-btn" data-key="q">Q</button>
            <button class="key-btn" data-key="w">W</button>
            <button class="key-btn" data-key="e">E</button>
            <button class="key-btn" data-key="r">R</button>

            <button class="key-btn" data-key="a">A</button>
            <button class="key-btn" data-key="s">S</button>
            <button class="key-btn" data-key="d">D</button>
            <button class="key-btn" data-key="f">F</button>

            <button class="key-btn" data-key="y">Y</button>
            <button class="key-btn" data-key="x">X</button>
            <button class="key-btn" data-key="c">C</button>
            <button class="key-btn" data-key="v">V</button>
        </div>
    </div>

</body>
<script type="module" src="index.js"></script>

</html>
